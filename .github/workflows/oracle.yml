name: Oracle
on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: oracle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the oracle image
        uses: docker/build-push-action@v7
        with:
          context: docker/oracle
          load: true
          tags: shipmonk-rrule-oracle:ci
          cache-from: type=gha,scope=oracle
          cache-to: type=gha,scope=oracle,mode=max

      # No lock file is committed, so Composer resolves versions for the PHP 8.1 of the image.
      - name: Install dependencies
        run: docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/app" shipmonk-rrule-oracle:ci composer install --no-progress --prefer-dist --no-interaction

      - name: Run oracle tests
        run: docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/app" shipmonk-rrule-oracle:ci vendor/bin/phpunit --testsuite oracle
