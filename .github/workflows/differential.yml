name: Differential tests
on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: differential-${{ github.ref }}
  cancel-in-progress: true

jobs:
  differential:
    name: libical, python-dateutil, zoneinfo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: docker/differential
          load: true
          tags: shipmonk-rrule-differential:ci
          cache-from: type=gha,scope=differential
          cache-to: type=gha,scope=differential,mode=max

      - name: Run the differential tests
        run: docker/differential/run.sh
        env:
          IMAGE: shipmonk-rrule-differential:ci
