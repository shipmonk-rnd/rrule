name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Composer normalize and validate
        run: composer check:composer

      - name: EditorConfig
        run: composer check:ec

      - name: Coding standard
        run: composer check:cs

      - name: PHPStan
        run: composer check:types

      - name: Dependency analysis
        run: composer check:dependencies

      - name: Name collisions
        run: composer check:collisions

  tests:
    name: Tests (PHP ${{ matrix.php-version }}, ${{ matrix.dependency-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4', '8.5']
        dependency-version: [prefer-lowest, prefer-stable]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Update dependencies
        run: composer update --no-interaction --no-progress --${{ matrix.dependency-version }}

      - name: PHPUnit
        run: composer check:tests

  reference:
    name: Reference snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # The naive expansion takes minutes, so the default suite compares the engine with a stored snapshot.
      # This job checks that the snapshot matches a new naive expansion.
      - name: PHPUnit reference suite
        run: composer check:reference

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # Every method must be fully covered (coverage-guard.php).
      - name: PHPUnit with coverage, coverage guard
        run: composer check:coverage

  mutations:
    name: Mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # Infection needs PHP 8.3+, so it lives in tools/infection with its own composer.json.
      # The job fails below the minMsi threshold in infection.json5.
      - name: Infection
        run: composer check:mutations
